<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penerjemah Dialog Game</title>
<style>
:root{--bg:rgba(0,0,0,.35);--card:rgba(22,18,40,.74);--tx:#f3f1fb;--mut:#c0bedb;--ac:#a78bfa;--acx:#150f2a;--bd:rgba(255,255,255,.16);--ok:#4cc380;--er:#ff8a8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(rgba(10,8,24,.25),rgba(10,8,24,.78)),#120d24 var(--bgimg,url(menu_bg.jpg)) center top/cover fixed no-repeat;color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:8px 0 4px}
p.sub{color:var(--mut);margin:0 0 16px;font-size:.92rem}
.hero{min-height:38vh;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:6px;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.card{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.82rem;color:var(--mut);margin-bottom:4px}
select,input[type=text],input[type=password],textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
textarea{resize:vertical;min-height:54px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1;min-width:140px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 16px;background:var(--ac);color:var(--acx);cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button:disabled{opacity:.5;cursor:default}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:22px;text-align:center;color:var(--mut)}
.drop input{margin-top:8px;max-width:100%}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar>i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.msg{font-size:.88rem;color:var(--mut);min-height:1.3em}
.msg.er{color:var(--er)}.msg.ok{color:var(--ok)}
.item{border-top:1px solid var(--bd);padding:10px 0}
.item:first-child{border-top:0}
.src{font-size:.88rem;color:var(--mut);white-space:pre-wrap;word-break:break-word;margin-bottom:6px}
.key{font-size:.72rem;color:var(--mut);opacity:.8;word-break:break-all}
.list{max-height:62vh;overflow-y:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hide{display:none}
</style>
</head>
<body>
<main>
<div class="hero"><h1>Penerjemah Dialog Game</h1>
<p class="sub">Unggah file dialog game (.txt, .json, .csv, .tsv, .srt, .ini, dan sejenisnya), terjemahkan, lalu unduh hasilnya dengan format asli.</p>
<div class="actions"><button id="bgset" class="sec">Ganti latar</button><button id="bgreset" class="sec">Latar bawaan</button><input id="bgfile" type="file" accept="image/*" class="hide"></div></div>

<div class="card">
  <div class="drop">Pilih file dialog<br><input id="file" type="file" accept=".txt,.json,.csv,.tsv,.srt,.ini,.xml,.lang,.po,.md,text/*,application/json"></div>
  <div id="info" class="msg"></div>
</div>

<div class="card">
  <div class="row">
    <div style="flex:2"><label for="key">API key Anthropic</label><input id="key" type="password" placeholder="sk-ant-…" autocomplete="off"></div>
    <div><label for="mdl">Model</label><input id="mdl" type="text" value="claude-haiku-5-5"></div>
  </div>
  <div class="msg">Disimpan hanya di HP ini. Buat key di console.anthropic.com.</div>
</div>

<div class="card">
  <div class="row">
    <div><label for="src">Bahasa asal</label>
      <select id="src"><option value="">Deteksi otomatis</option><option>Inggris</option><option>Jepang</option><option>Mandarin</option><option>Korea</option><option>Spanyol</option><option>Prancis</option><option>Jerman</option><option>Rusia</option><option>Portugis</option><option>Indonesia</option></select></div>
    <div><label for="dst">Terjemahkan ke</label>
      <select id="dst"><option>Indonesia</option><option>Inggris</option><option>Jepang</option><option>Mandarin</option><option>Korea</option><option>Spanyol</option><option>Prancis</option><option>Jerman</option><option>Rusia</option><option>Portugis</option></select></div>
  </div>
  <div style="margin-top:10px"><label for="ctx">Catatan konteks (opsional)</label>
    <input id="ctx" type="text" placeholder="Contoh: game RPG fantasi, nada santai, nama karakter jangan diubah"></div>
  <div class="actions"><button id="go" disabled>Terjemahkan semua</button><button id="stop" class="sec hide">Berhenti</button></div>
  <div class="bar"><i id="pb"></i></div>
  <div id="st" class="msg"></div>
</div>

<div id="res" class="card hide">
  <div class="list" id="list"></div>
  <div class="actions">
    <button id="dl">Unduh hasil</button>
    <button id="cp" class="sec">Salin semua</button>
    <button id="retry" class="sec hide">Ulangi yang gagal</button>
  </div>
  <div id="rm" class="msg"></div>
</div>
</main>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var S={name:"",kind:"lines",raw:"",json:null,entries:[],out:[],ctrl:null};
  var BATCH=20;
  function applyBg(u){document.documentElement.style.setProperty("--bgimg",u?'url("'+u+'")':"url(menu_bg.jpg)")}
  try{var sb=localStorage.getItem("bg");if(sb)applyBg(sb)}catch(e){}
  $("bgset").addEventListener("click",function(){$("bgfile").click()});
  $("bgreset").addEventListener("click",function(){applyBg("");try{localStorage.removeItem("bg")}catch(e){}});
  $("bgfile").addEventListener("change",function(ev){
    var f=ev.target.files&&ev.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var sc=Math.min(1,1080/Math.max(im.width,im.height)),c=document.createElement("canvas");
        c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        var u=c.toDataURL("image/jpeg",0.82);
        applyBg(u);
        try{localStorage.setItem("bg",u)}catch(e){setMsg($("info"),"Latar dipakai, tetapi terlalu besar untuk disimpan permanen.","er")}
      };
      im.onerror=function(){setMsg($("info"),"Gambar tidak bisa dibaca.","er")};
      im.src=String(r.result);
    };
    r.readAsDataURL(f);ev.target.value="";
  });
  try{$("key").value=localStorage.getItem("k")||"";$("mdl").value=localStorage.getItem("m")||$("mdl").value}catch(e){}
  $("key").addEventListener("input",function(){try{localStorage.setItem("k",$("key").value.trim())}catch(e){}});
  $("mdl").addEventListener("input",function(){try{localStorage.setItem("m",$("mdl").value.trim())}catch(e){}});

  function setMsg(el,t,c){el.textContent=t||"";el.className="msg"+(c?" "+c:"")}

  function walk(node,path,acc){
    if(typeof node==="string"){ if(node.trim()) acc.push({path:path,text:node}); return }
    if(Array.isArray(node)){ node.forEach(function(v,i){walk(v,path.concat([i]),acc)}); return }
    if(node&&typeof node==="object"){ Object.keys(node).forEach(function(k){walk(node[k],path.concat([k]),acc)}) }
  }
  function setAt(obj,path,val){
    var o=obj; for(var i=0;i<path.length-1;i++) o=o[path[i]]; o[path[path.length-1]]=val;
  }

  function load(name,text){
    S.name=name;S.raw=text;S.json=null;S.entries=[];S.out=[];
    var isJson=/\.json$/i.test(name);
    if(isJson){
      try{
        S.json=JSON.parse(text);S.kind="json";
        walk(S.json,[],S.entries);
        S.entries.forEach(function(e){e.key=e.path.join(".")});
      }catch(err){S.json=null;isJson=false}
    }
    if(!isJson){
      S.kind="lines";
      text.replace(/\r\n/g,"\n").split("\n").forEach(function(l,i){
        if(l.trim()) S.entries.push({line:i,text:l,key:"baris "+(i+1)});
      });
    }
    S.out=S.entries.map(function(){return ""});
    setMsg($("info"),S.entries.length+" teks ditemukan di “"+name+"”"+(S.kind==="json"?" (JSON, struktur dijaga)":" (per baris)"),S.entries.length?"ok":"er");
    $("go").disabled=!S.entries.length;
    render();
  }

  function render(){
    var box=$("list");box.textContent="";
    $("res").classList.toggle("hide",!S.entries.length);
    S.entries.forEach(function(e,i){
      var d=document.createElement("div");d.className="item";
      var k=document.createElement("div");k.className="key";k.textContent=e.key;
      var s=document.createElement("div");s.className="src";s.textContent=e.text;
      var t=document.createElement("textarea");t.id="t"+i;t.value=S.out[i]||"";t.placeholder="Terjemahan…";
      t.addEventListener("input",function(){S.out[i]=t.value});
      d.appendChild(k);d.appendChild(s);d.appendChild(t);box.appendChild(d);
    });
  }

  function setOut(i,v){S.out[i]=v;var t=$("t"+i);if(t)t.value=v}

  function buildPrompt(batch){
    var src=$("src").value,dst=$("dst").value,ctx=$("ctx").value.trim();
    return "Kamu penerjemah dialog game profesional. Terjemahkan setiap teks di bawah"+(src?" dari bahasa "+src:"")+" ke bahasa "+dst+". "
    +"Aturan: pertahankan persis semua kode/penanda seperti {name}, [color=red], <b>, %s, %d, \\n, tag, dan tanda kontrol lain; jangan ubah nama diri kecuali ada padanan umum; jaga nada dan panjang kira-kira setara agar muat di kotak dialog; jangan menambah penjelasan. "
    +(ctx?"Konteks: "+ctx+". ":"")
    +"Balas HANYA dengan array JSON berisi string terjemahan, jumlah dan urutannya sama persis dengan masukan ("+batch.length+" item), tanpa teks lain.\n\nMasukan:\n"+JSON.stringify(batch);
  }

  async function run(onlyFailed){
    var apiKey=$("key").value.trim();
    if(!apiKey){setMsg($("st"),"Isi API key Anthropic dulu.","er");return}
    var lastErr="";
    var idx=[];S.entries.forEach(function(e,i){if(!onlyFailed||!S.out[i])idx.push(i)});
    if(!idx.length)return;
    S.ctrl=new AbortController();
    $("go").disabled=true;$("stop").classList.remove("hide");$("retry").classList.add("hide");
    var done=0,fail=0;
    for(var b=0;b<idx.length;b+=BATCH){
      if(S.ctrl.signal.aborted)break;
      var part=idx.slice(b,b+BATCH);
      setMsg($("st"),"Menerjemahkan "+(b+1)+"–"+Math.min(b+BATCH,idx.length)+" dari "+idx.length+"…");
      try{
        var res=await callApi(buildPrompt(part.map(function(i){return S.entries[i].text})),S.ctrl.signal,apiKey);
        if(!Array.isArray(res)||res.length!==part.length)throw new Error("Jumlah hasil tidak cocok");
        part.forEach(function(i,j){setOut(i,String(res[j]))});
      }catch(err){
        if(S.ctrl.signal.aborted)break;
        fail+=part.length;lastErr=err&&err.message?err.message:"";
        if(err&&err.code==="not_granted"){setMsg($("st"),"API key ditolak. Periksa kembali key-nya.","er");break}
        if(err&&err.code==="rate_limited"){setMsg($("st"),"Terlalu sering. Tunggu sebentar lalu tekan “Ulangi yang gagal”.","er");break}
      }
      done+=part.length;
      $("pb").style.width=Math.round(done/idx.length*100)+"%";
    }
    var left=S.out.filter(function(v){return !v}).length;
    $("stop").classList.add("hide");$("go").disabled=false;
    $("retry").classList.toggle("hide",!left);
    setMsg($("st"),left?("Selesai, "+left+" teks belum terjemah"+(lastErr?" ("+lastErr+")":"")+". Tekan “Ulangi yang gagal”."):"Selesai. Periksa dan edit hasilnya di bawah.",left?"er":"ok");
  }

  async function callApi(prompt,signal,key){
    var r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:signal,headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:$("mdl").value.trim()||"claude-haiku-5-5",max_tokens:4096,messages:[{role:"user",content:prompt}]})});
    var j=await r.json();
    if(!r.ok){var e=new Error((j.error&&j.error.message)||("Error "+r.status));e.code=r.status===401?"not_granted":(r.status===429?"rate_limited":"api");throw e}
    var t=j.content.map(function(c){return c.text||""}).join("").replace(/```json|```/g,"").trim();
    return JSON.parse(t);
  }

  function buildOutput(){
    if(S.kind==="json"){
      var copy=JSON.parse(JSON.stringify(S.json));
      S.entries.forEach(function(e,i){setAt(copy,e.path,S.out[i]||e.text)});
      return JSON.stringify(copy,null,2);
    }
    var lines=S.raw.replace(/\r\n/g,"\n").split("\n");
    S.entries.forEach(function(e,i){lines[e.line]=S.out[i]||e.text});
    return lines.join("\n");
  }

  function outName(){
    var m=S.name.match(/^(.*?)(\.[^.]*)?$/);
    return (m[1]||"hasil")+".terjemahan"+(m[2]||".txt");
  }

  $("file").addEventListener("change",function(ev){
    var f=ev.target.files&&ev.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){load(f.name,String(r.result))};
    r.onerror=function(){setMsg($("info"),"File tidak bisa dibaca.","er")};
    r.readAsText(f);
  });
  $("go").addEventListener("click",function(){$("pb").style.width="0";run(false)});
  $("retry").addEventListener("click",function(){run(true)});
  $("stop").addEventListener("click",function(){if(S.ctrl)S.ctrl.abort();setMsg($("st"),"Dihentikan.")});

  $("dl").addEventListener("click",async function(){
    var data=buildOutput();
    try{
      if(window.Android&&Android.saveFile(outName(),data)){setMsg($("rm"),"Tersimpan di folder Unduhan: "+outName(),"ok");return}
      throw new Error("na");
    }catch(err){
      try{await navigator.clipboard.writeText(data);setMsg($("rm"),"Unduhan tidak tersedia, hasil disalin ke papan klip.","ok")}
      catch(e2){setMsg($("rm"),"Unduhan dan salin gagal. Salin manual dari kotak terjemahan.","er")}
    }
  });
  $("cp").addEventListener("click",async function(){
    try{await navigator.clipboard.writeText(buildOutput());setMsg($("rm"),"Tersalin.","ok")}
    catch(e){setMsg($("rm"),"Salin gagal di browser ini.","er")}
  });
})();
</script>
</body>
</html>
